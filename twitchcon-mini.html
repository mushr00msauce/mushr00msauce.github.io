<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TwitchCon 2027 Mini Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  /* OBS Browser Source: https://themushbox.com/twitchcon-mini.html  —  Width 360, Height 130. Transparent background. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;overflow:hidden}
  .box{
    position:absolute; top:6px; left:6px; width:340px;
    padding:10px 12px 12px; text-align:center;
    background:radial-gradient(ellipse at 50% 0%,rgba(15,27,61,.9) 0%,rgba(5,7,13,.85) 70%);
    border:1px solid rgba(94,200,255,.3); border-radius:14px;
    box-shadow:0 0 18px rgba(43,92,255,.3);
    color:#f4f7ff; font-family:Rajdhani,sans-serif;
  }
  h1{font-family:Orbitron,sans-serif; font-weight:800; font-size:17px; letter-spacing:.04em; line-height:1.1;
     background:linear-gradient(90deg,#5ec8ff,#2b5cff 55%,#9146ff); -webkit-background-clip:text; background-clip:text; color:transparent}
  .clock{display:flex; gap:6px; margin-top:8px}
  .unit{flex:1; background:rgba(20,32,70,.6); border:1px solid rgba(94,200,255,.25); border-radius:9px; padding:6px 0 5px;
        box-shadow:0 0 12px rgba(43,92,255,.18) inset}
  .num{font-family:Orbitron,sans-serif; font-weight:800; font-size:24px; line-height:1; font-variant-numeric:tabular-nums}
  .unit.days .num{color:#5ec8ff; text-shadow:0 0 12px rgba(94,200,255,.5)}
  .lbl{margin-top:4px; font-size:10px; font-weight:700; letter-spacing:.25em; color:#8a96b8; text-transform:uppercase}
  .done{display:none; font-family:Orbitron,sans-serif; font-weight:800; font-size:22px; color:#5ec8ff; margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <h1>TWITCHCON SAN DIEGO 2027</h1>
  <div class="clock" id="clock">
    <div class="unit days"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
    <div class="unit"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
    <div class="unit"><div class="num" id="m">--</div><div class="lbl">Min</div></div>
    <div class="unit"><div class="num" id="s">--</div><div class="lbl">Sec</div></div>
  </div>
  <div class="done" id="done">WE'RE HERE! 🍄</div>
</div>
<script>
  const TARGET = Date.UTC(2027, 9, 8, 17, 0, 0); // Oct 8 2027, 10:00 AM PT
  const END    = Date.UTC(2027, 9, 11, 7, 0, 0); // after Oct 10 ends PT
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  function tick(){
    const now = Date.now(), diff = TARGET - now;
    if (diff <= 0){
      $('clock').style.display = 'none'; $('done').style.display = 'block';
      if (now > END) $('done').textContent = 'GG, San Diego!';
      return;
    }
    const t = Math.floor(diff / 1000);
    $('d').textContent = Math.floor(t / 86400);
    $('h').textContent = pad(Math.floor(t % 86400 / 3600));
    $('m').textContent = pad(Math.floor(t % 3600 / 60));
    $('s').textContent = pad(t % 60);
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
