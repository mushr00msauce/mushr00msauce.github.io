<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mushbox Admin</title>
<style>
  :root{
    --bg: #0d1210;
    --panel: #131a17;
    --panel-2: #0f1512;
    --line: #223028;
    --moss: #6fae7c;
    --moss-bright: #8fd39e;
    --spore: #b98ce0;
    --text: #dfe8e2;
    --text-dim: #8fa298;
    --warn: #e0a458;
    --danger: #e0705c;
    --mono: "JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans: "Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(111,174,124,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(185,140,224,0.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.55;
    padding-bottom:80px;
  }
  a{color:var(--moss-bright); text-decoration:none;}

  header.top{
    padding:56px 24px 36px;
    max-width:900px;
    margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--spore);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--spore);
    box-shadow:0 0 8px var(--spore);
  }
  h1{
    font-size:clamp(28px,4vw,40px);
    margin:0 0 12px;
    letter-spacing:-0.01em;
    font-weight:650;
  }
  .lede{
    color:var(--text-dim);
    font-size:16px;
    max-width:640px;
  }

  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin:32px 0 18px;
  }
  .search{
    flex:1;
    max-width:320px;
    position:relative;
  }
  .search input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 12px 9px 34px;
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    outline:none;
    transition:border-color .15s ease;
  }
  .search input:focus{border-color:var(--moss);}
  .search::before{
    content:"⌕";
    position:absolute;
    left:12px; top:50%;
    transform:translateY(-50%);
    color:var(--text-dim);
    font-size:15px;
  }
  .count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:640px){ .grid{grid-template-columns:1fr;} }

  .card{
    display:block;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{
    border-color:var(--moss);
    transform:translateY(-1px);
  }
  .card-title{
    font-weight:600;
    font-size:15px;
    color:var(--text);
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-title .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--moss);
    flex-shrink:0;
  }
  .card-file{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-dim);
  }

  .state{
    padding:40px 0;
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:13px;
    text-align:center;
  }
  .state.error{color:var(--danger);}

  footer{
    max-width:900px;
    margin:64px auto 0;
    padding:24px 24px 0;
    border-top:1px solid var(--line);
    color:var(--text-dim);
    font-size:12.5px;
    font-family:var(--mono);
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Mushbox Internal</div>
  <h1>Admin</h1>
  <p class="lede">
    Every guide and tool in this folder, listed automatically. Drop a new .html file into <code>/admin/</code> and it shows up here — nothing to edit.
  </p>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search">
      <input type="text" id="searchBox" placeholder="Filter pages..." oninput="renderList()" />
    </div>
    <div class="count" id="countLabel"></div>
  </div>

  <div id="listArea">
    <div class="state" id="loadingState">Loading pages from repo…</div>
  </div>
</div>

<footer>
  mushbox internal — admin index — auto-generated from /admin/ via github api
</footer>

<script>
  const REPO_OWNER = "mushr00msauce";
  const REPO_NAME = "mushr00msauce.github.io";
  const FOLDER_PATH = "admin";
  const SELF_FILENAME = "index.html";

  let allPages = [];

  function titleFromFilename(filename) {
    const base = filename.replace(/\.html?$/i, "");
    return base
      .split(/[-_]+/)
      .map(w => w.charAt(0).toUpperCase() + w.slice(1))
      .join(" ");
  }

  async function loadPages() {
    const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}`;
    try {
      const res = await fetch(apiUrl, {
        headers: { "Accept": "application/vnd.github+json" }
      });
      if (!res.ok) {
        throw new Error(`GitHub API returned ${res.status}`);
      }
      const data = await res.json();
      allPages = data
        .filter(item => item.type === "file")
        .filter(item => /\.html?$/i.test(item.name))
        .filter(item => item.name.toLowerCase() !== SELF_FILENAME.toLowerCase())
        .map(item => ({
          name: item.name,
          title: titleFromFilename(item.name),
          url: item.name
        }))
        .sort((a, b) => a.title.localeCompare(b.title));

      document.getElementById("loadingState").remove();
      renderList();
    } catch (err) {
      document.getElementById("listArea").innerHTML =
        `<div class="state error">Couldn't load the file list (${err.message}). If this repo is private, the GitHub API can't list its contents from a public page — you'll need a fallback list. Check the console for details.</div>`;
      console.error(err);
    }
  }

  function renderList() {
    const query = document.getElementById("searchBox").value.trim().toLowerCase();
    const filtered = allPages.filter(p =>
      p.title.toLowerCase().includes(query) || p.name.toLowerCase().includes(query)
    );

    const listArea = document.getElementById("listArea");
    const countLabel = document.getElementById("countLabel");
    countLabel.textContent = `${filtered.length} page${filtered.length === 1 ? "" : "s"}`;

    if (filtered.length === 0) {
      listArea.innerHTML = `<div class="state">No pages match "${query}".</div>`;
      return;
    }

    listArea.innerHTML = `<div class="grid">${filtered.map(p => `
      <a class="card" href="${p.url}">
        <div class="card-title"><span class="dot"></span>${p.title}</div>
        <div class="card-file">${p.name}</div>
      </a>
    `).join("")}</div>`;
  }

  loadPages();
</script>

</body>
</html>
