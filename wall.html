<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mushbox Command Center</title>
<!--
  Mushbox Command Center — live monitor wall
  ============================================================
  Static page, no build step. Drop this next to map.html / stats.html
  on the same site (themushbox.com, mushboxes.com, or the GitHub Pages
  mirror) so it's served from one of the origins the worker and Twitch's
  own embed check already allow — see ALLOWED_ORIGINS in worker.txt.

  Data source: the same Cloudflare Worker that powers map.html
  (GET / for live status, GET /avatars for pics+names). No new worker
  routes or KV needed — this page only reads what already exists and
  reuses the existing POST /click beacon (source: "wall") for outbound
  click tracking, same pattern as the map's popup/sidebar clicks.

  Default view: top 4 by viewer count (the worker already returns
  `live` sorted by viewers descending). A "Show more" control expands
  the wall in tiers (4 → 9 → 16 → all currently live) without ever
  reloading a tile that's already on screen, so an expand never
  interrupts a stream already playing.

  Config: just the one constant below.
-->
<style>
  :root{
    /* Pulled straight from themushbox.com's own stylesheet (--navy,
       --royal, --sky, --card, --card-edge, --text, --twitch below all
       match its real values exactly) rather than guessed. */
    --bg: #04081A;        /* --ink on the main site */
    --bg-deep: #060D24;   /* --navy-deep */
    --panel: #0E1B42;     /* --card */
    --panel-border: #1B2C5E; /* --card-edge */
    --text: #D7E3FF;
    --text-dim: #8FA3CC;
    --text-faint: #55688f;
    --accent: #1E6FFF;    /* --royal — the actual "Mushbox blue" */
    --accent-dim: #163f8f;
    --sky: #4DB8FF;       /* lighter secondary blue used for glows/hovers site-wide */
    --twitch: #9146FF;
    --kick: #53fc18;
    --encoder: #FFC24D;   /* matches the site's own amber accent (encoder/telemetry icon) */
    --danger: #FF3B4E;    /* matches the site's own "LIVE" pulse-dot red */
    --focus-ring: #4DB8FF;
    font-family: "JetBrains Mono", "SF Mono", "Consolas", ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(900px 480px at 50% -10%, rgba(30,111,255,.22), transparent 60%),
      radial-gradient(700px 420px at 85% 100%, rgba(77,184,255,.08), transparent 55%),
      var(--bg);
    color: var(--text);
  }
  /* Faint CRT scanlines over the whole page — part of the security-monitor
     read, kept subtle enough not to fight legibility. Never intercepts
     clicks. */
  body::before{
    content:""; position:fixed; inset:0; z-index:1000; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom, rgba(77,184,255,.035) 0px, rgba(77,184,255,.035) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
  }
  body{
    display:flex; flex-direction:column;
    height:100vh; overflow:hidden; /* no page scroll — tiles shrink to fit instead */
  }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; gap:16px;
    padding: 14px 20px;
    background: linear-gradient(180deg, rgba(10,21,53,.95), rgba(6,13,36,.85));
    border-bottom: 1px solid rgba(77,184,255,.3);
    position: sticky; top:0; z-index: 50;
    flex-wrap: wrap;
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
  .brand .dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--danger);
    animation: livePulse 1.8s ease-out infinite;
  }
  /* Same pulsing-ring the site's own map badges use for a live indicator. */
  @keyframes livePulse{
    0%{ box-shadow: 0 0 0 0 rgba(255,59,78,.7); }
    70%{ box-shadow: 0 0 0 8px rgba(255,59,78,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,59,78,0); }
  }
  .brand h1{
    font-size: 15px; letter-spacing: .12em; margin:0;
    text-transform: uppercase; color: var(--text);
    font-weight: 700;
  }
  .brand h1 span{ color: var(--accent); }
  .brand small{
    display:block; color: var(--text-dim); font-size:10px; letter-spacing:.08em;
  }

  .stat{
    display:flex; flex-direction:column; align-items:flex-end;
    font-size:10px; color:var(--text-dim); letter-spacing:.06em; line-height:1.5;
  }
  .stat b{ color:var(--text); font-size:13px; }

  .btn{
    appearance:none; border:1px solid var(--panel-border);
    background: var(--panel); color: var(--text);
    font-family: inherit; font-size: 11px; letter-spacing:.06em;
    padding: 8px 12px; border-radius: 6px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition: border-color .15s, color .15s, background .15s;
  }
  .btn:hover{ border-color: var(--sky); color: var(--sky); background:#10204E; }
  .btn:active{ transform: translateY(1px); }
  .btn.primary{ border-color: var(--accent); color: var(--sky); }
  .btn:disabled{ opacity:.35; cursor:default; }
  .btn:disabled:hover{ border-color:var(--panel-border); color:var(--text); }

  select.btn{ padding-right:6px; }

  .btn.toggle{ user-select:none; }
  .btn.toggle input{
    appearance:none; -webkit-appearance:none;
    width:14px; height:14px; margin:0; flex-shrink:0;
    border:1px solid var(--panel-border); border-radius:3px;
    background: var(--bg); cursor:pointer; position:relative;
  }
  .btn.toggle input:checked{ background: var(--accent); border-color: var(--accent); }
  .btn.toggle input:checked::after{
    content:""; position:absolute; left:4px; top:1px;
    width:4px; height:8px; border:solid var(--bg);
    border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .btn.toggle:has(input:checked){ border-color: var(--accent-dim); color: var(--accent); }

  /* ---------- error / status banner ---------- */
  #banner{
    display:none; padding:8px 20px; font-size:12px;
    background: rgba(255,59,78,.12); color:#ff9aa8;
    border-bottom: 1px solid rgba(255,59,78,.3);
  }
  #banner.show{ display:block; }
  #banner{ flex-shrink:0; }

  /* ---------- main grid ---------- */
  main{
    flex:1; min-height:0; padding: 18px; display:flex; flex-direction:column; gap:14px;
    overflow:hidden;
  }
  #empty{
    margin:auto; text-align:center; color: var(--text-dim);
    display:none; flex-direction:column; gap:8px; align-items:center;
  }
  #empty.show{ display:flex; }
  #empty .glyph{ color: var(--sky); opacity:.55; }

  /* A plain (non-3D) flex box that just holds #grid and is what the
     corrective "shrink to fit the tilt's bulge" scale (see
     fitTiltedGridToBounds) is applied to — NOT #grid itself, since
     scaling the same element that also establishes `perspective` for
     its children composes those two transforms in a way that doesn't
     behave like a simple uniform shrink. Keeping them on separate
     elements sidesteps that entirely. */
  #gridStage{
    flex:1; min-height:0; display:flex;
  }
  #grid{
    display:grid; gap:12px;
    flex:1; min-height:0; width:100%;
    justify-content:center; align-content:center;
    perspective: 950px; /* shared vanishing point for the desk-curve tilt below */
    /* grid-template-columns / grid-auto-rows are set in px by JS
       (layoutGrid) so every tile is sized to actually fit the
       available space — see the script below. */
  }

  /* `.tile` is the physical bezel — thick plastic frame, like a real
     monitor housing. The actual picture lives in the nested `.screen`
     (below), which is what gets clipped to rounded "glass" corners. */
  .tile{
    position:relative;
    background: linear-gradient(155deg, #262c3d 0%, #131826 55%, #090c14 100%);
    padding: 8px 8px 12px;
    border-radius: 15px;
    border: 1px solid #333c54;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 -3px 6px rgba(0,0,0,.55),
      0 12px 30px -14px rgba(0,0,0,.85);
    display:flex; flex-direction:column;
    min-height:0;
    transform-style: preserve-3d;
    transition: transform .5s ease;
    animation: tileIn .3s ease;
  }
  /* Opacity only — NOT transform. `.tile`'s transform is exclusively
     JS-controlled (see applyDeskTilt) for the desk-tilt effect, and a
     CSS keyframe animation targeting the same property overrides
     inline style.transform for as long as the animation runs, no
     matter what JS sets it to. That silently ate the very first tilt
     application on every newly created tile (the whole first ~0.3s),
     during which fitTiltedGridToBounds() measured an untitled,
     un-bulged box and decided no corrective shrink was needed — only
     for the real (tilted) geometry to pop in once this animation
     finished and blow past the safe bounds it had just approved.  */
  @keyframes tileIn{ from{ opacity:0; } to{ opacity:1; } }

  /* The one big tile in the middle — #1 by viewer count — set slightly
     back from the rest (see applyDeskTilt), like the flat center panel
     of a curved desk monitor array. */
  .tile.hero{ z-index:2; }
  .tile.hero .screen{
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.7),
      0 0 0 2px var(--accent),
      0 0 34px rgba(30,111,255,.4);
  }

  /* Small "power LED" on the bottom bezel — purely cosmetic hardware
     detail, lit whenever the feed is actually live. */
  .tile .led{
    position:absolute; left:50%; bottom:4px; transform:translateX(-50%);
    width:5px; height:5px; border-radius:50%;
    background: var(--sky); box-shadow: 0 0 4px var(--sky);
    opacity:.85; z-index:1;
  }

  .tile .screen{
    position:relative; flex:1; min-height:0;
    background:#000; border-radius:6px; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.6);
  }
  .tile.audio-focus .screen{
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), 0 0 0 2px var(--accent), 0 0 18px rgba(30,111,255,.55);
  }

  .tile .frame-wrap{ flex:1; position:relative; background:#000; }
  .tile iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  /* Faint glass sheen across the picture, like the glossy coating in the
     reference monitor-wall photo. A real element (not ::after) since the
     corner-reticle brackets below already use frame-wrap's ::before/::after. */
  .tile .sheen{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background: linear-gradient(115deg, rgba(255,255,255,.05) 0%, transparent 26%);
  }

  .tile .placeholder{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px;
    color: var(--text-dim); text-align:center; padding: 0 12px;
    background: repeating-linear-gradient(135deg, #081130 0 10px, #0a1538 10px 20px);
  }
  .tile .placeholder .spin{
    width:22px; height:22px; border-radius:50%;
    border: 2px solid var(--encoder); border-top-color: transparent;
    animation: spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .tile .placeholder .tele{ font-size:10px; color: var(--text-faint); }

  .tile .bar{
    display:flex; align-items:center; gap:8px;
    height:36px; flex-shrink:0; box-sizing:border-box;
    padding: 0 8px;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    font-size: 11px;
  }
  .tile .avatar{
    width:22px; height:22px; border-radius:50%;
    object-fit:cover; flex-shrink:0; background: var(--panel-border);
    border:1px solid var(--panel-border);
  }
  .tile .who{ display:flex; flex-direction:column; min-width:0; flex:1; }
  .tile .who b{
    font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tile .who .title{
    font-size:10px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tile .viewers{
    display:flex; align-items:center; gap:4px;
    font-size:11px; color: var(--danger); font-weight:600; flex-shrink:0;
  }
  .tile .viewers .liveDot{
    width:6px; height:6px; border-radius:50%; background: var(--danger);
    animation: livePulse 1.8s ease-out infinite;
  }
  .tile .icon-btn{
    background:none; border:0; color: var(--text-dim); cursor:pointer;
    font-size:13px; padding:2px 4px; flex-shrink:0; line-height:1;
  }
  .tile .icon-btn:hover{ color: var(--accent); }

  /* HUD-style camera tag rather than a solid marketing-color pill — a
     small colored status dot carries the platform, the tag itself stays
     in the monitor-wall's own dark/blue chrome. */
  .badge{
    position:absolute; top:6px; left:6px; z-index:2;
    display:flex; align-items:center; gap:5px;
    font-size:9px; letter-spacing:.08em; text-transform:uppercase;
    padding: 3px 7px 3px 6px; border-radius: 3px; font-weight:700;
    color: var(--text); background: rgba(4,8,26,.75);
    border: 1px solid rgba(77,184,255,.3);
    backdrop-filter: blur(3px);
  }
  .badge::before{
    content:""; width:6px; height:6px; border-radius:50%; flex-shrink:0;
  }
  .badge.twitch::before{ background: var(--twitch); box-shadow:0 0 5px var(--twitch); }
  .badge.kick::before{ background: var(--kick); box-shadow:0 0 5px var(--kick); }
  .badge.encoder::before{ background: var(--encoder); box-shadow:0 0 5px var(--encoder); }

  /* Corner reticle brackets on every tile — the one purely decorative
     "security monitor" cue, kept subtle and click-through. */
  .tile .frame-wrap::before, .tile .frame-wrap::after,
  .tile .reticle-r::before, .tile .reticle-r::after{
    content:""; position:absolute; width:14px; height:14px; z-index:3;
    pointer-events:none; border: 1.5px solid rgba(77,184,255,.45);
  }
  .tile .frame-wrap::before{ top:4px; left:4px; border-right:none; border-bottom:none; }
  .tile .frame-wrap::after{ bottom:4px; left:4px; border-right:none; border-top:none; }
  .tile .reticle-r{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .tile .reticle-r::before{ top:4px; right:4px; left:auto; border-left:none; border-bottom:none; }
  .tile .reticle-r::after{ bottom:4px; right:4px; left:auto; border-left:none; border-top:none; }

  .tele-badge{
    position:absolute; top:6px; right:6px; z-index:2;
    font-size:10px; letter-spacing:.02em;
    padding: 3px 7px; border-radius: 4px; font-weight:600;
    color: var(--encoder); background: rgba(4,8,26,.75);
    border: 1px solid rgba(255,194,77,.4);
    white-space:nowrap;
  }

  /* ---------- footer / expand strip ---------- */
  footer{
    padding: 10px 20px 14px; display:flex; justify-content:center;
    flex-shrink:0; max-height:130px; overflow-y:auto;
  }
  footer.empty{ display:none; }
  .up-next{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-top: 8px; max-width: 900px;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    background: var(--panel); border:1px solid var(--panel-border);
    border-radius: 999px; padding: 4px 10px 4px 4px; font-size:11px;
    color: var(--text-dim);
  }
  .chip img{ width:16px; height:16px; border-radius:50%; }
  .chip b{ color: var(--text); }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--panel-border); border-radius:4px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>MUSH<span>BOX</span> // COMMAND CENTER</h1>
      <small id="updatedAt">connecting…</small>
    </div>
  </div>

  <div class="stat"><b id="liveCount">–</b>live now</div>
  <div class="stat"><b id="shownCount">–</b>on wall</div>

  <label class="btn toggle" id="irlToggleLabel" title="Show only IRL/mobile streams">
    <input type="checkbox" id="irlOnly"> IRL only
  </label>
  <select id="gridSize" class="btn" title="Wall size"></select>
  <button id="refreshBtn" class="btn" title="Refresh now">⟳ Refresh</button>
</header>

<div id="banner"></div>

<main>
  <div id="empty">
    <svg class="glyph" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="5.5" width="14" height="11" rx="1.5"/>
      <path d="M19.5 9.5 22 8v8l-2.5-1.5"/>
      <path d="M2.5 2.5 21.5 21.5"/>
    </svg>
    <div style="letter-spacing:.14em; font-size:11px; color:var(--text-dim);">NO SIGNAL</div>
    <div>No mushboxes are live right now.</div>
  </div>
  <div id="gridStage"><div id="grid"></div></div>
</main>

<footer id="wallFooter">
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <button id="moreBtn" class="btn primary" style="display:none;">Show more</button>
    <div id="upNext" class="up-next"></div>
  </div>
</footer>

<script>
(function(){
  "use strict";

  // ---- config -------------------------------------------------------
  // The Cloudflare Worker behind map.html / stats.html. Its CORS
  // allowlist (ALLOWED_ORIGINS in worker.txt) is themushbox.com,
  // www.themushbox.com, mushboxes.com, www.mushboxes.com and
  // mushr00msauce.github.io — this page only works when served from one
  // of those. If you ever move the worker, update this one line.
  const WORKER_BASE = "https://mushbox-live.wkennedy74.workers.dev";

  // Same list, used as Twitch's required `parent` values so the embed
  // works no matter which of those domains this file ends up served
  // from (Twitch checks the real hosting domain against every `parent`
  // you pass, so it's safe to just list them all).
  const TWITCH_PARENTS = [
    "themushbox.com", "www.themushbox.com",
    "mushboxes.com", "www.mushboxes.com",
    "mushr00msauce.github.io"
  ];

  const POLL_MS = 60_000;       // matches the worker's own 60s edge cache
  const AVATAR_POLL_MS = 10 * 60_000; // avatars/names change rarely
  const TIERS = [4, 9, 16, 25];  // "Show more" steps before "all"

  // ---- state ----------------------------------------------------------
  let liveByLogin = new Map();   // login -> live entry from the worker
  let avatars = {};
  let names = {};
  let fullOrder = [];             // ALL live logins, viewer count desc (unfiltered)
  let order = [];                // logins actually eligible for the wall (after IRL filter)
  let visibleCount = TIERS[0];
  let audioFocusLogin = null;    // which tile (if any) currently has sound
  let refreshTimer = null;
  let irlOnly = false;

  try { irlOnly = localStorage.getItem("mushbox_irlOnly") === "1"; } catch(e){}

  // A stream counts as "IRL" if its game/category name contains "IRL"
  // (Twitch's IRL category, and Kick's equivalent, both come through the
  // worker's `game` field literally named that way — same text the map
  // page already reads for its "IRL · Twitch IRL · Kick Live" labels).
  // Encoder-only "warming up" entries have no game/category yet — since
  // the encoder itself (Belabox) is inherently a mobile/IRL rig, those
  // always count as IRL rather than being filtered out before they even
  // have a chance to report a category.
  function isIRL(entry){
    if (!entry) return false;
    if (entry.platform === "encoder") return true;
    return (entry.game || "").toLowerCase().includes("irl");
  }

  function applyFilter(){
    order = irlOnly
      ? fullOrder.filter(l => isIRL(liveByLogin.get(l)))
      : fullOrder.slice();
  }

  const $ = (sel) => document.querySelector(sel);
  const gridEl = $("#grid");
  const gridStageEl = $("#gridStage");
  const emptyEl = $("#empty");
  const bannerEl = $("#banner");
  const moreBtn = $("#moreBtn");
  const upNextEl = $("#upNext");
  const gridSizeSel = $("#gridSize");
  const footerEl = $("#wallFooter");

  // ---- fit-to-screen layout -------------------------------------------
  // Sizes every tile so the whole wall fits inside the viewport with no
  // page scrolling, instead of stretching tiles to a fixed aspect ratio
  // and letting the extra rows run off the bottom of the screen. Picks
  // whichever uniform column count yields the LARGEST tile that still
  // fits — same idea as Zoom/Discord "gallery view" sizing.
  const TILE_ASPECT = 16 / 9;   // video area only — the bar below is fixed-height
  const TILE_BAR_H = 36;        // must match .tile .bar's CSS height
  const GRID_GAP = 12;          // must match #grid's CSS gap
  const HERO_MIN_COUNT = 3;     // need at least this many tiles before a 2x2 hero makes sense
  const HERO_EXTRA_SLOTS = 3;   // a 2x2 span = 4 cells for 1 tile, i.e. 3 "extra" over a normal 1x1
  let lastVisible = [];         // logins in rank order, from the most recent render()

  // heroExtra > 0 asks for enough room to also fit one 2x2 spanning tile
  // among `count` total tiles (see layoutGrid). Returns null if nothing
  // fits at all; the hero-aware caller falls back to heroExtra:0 itself.
  function computeBestGrid(containerW, containerH, count, heroExtra){
    if (count <= 0 || containerW <= 0 || containerH <= 0) return null;
    heroExtra = heroExtra || 0;
    const effective = count + heroExtra;
    let best = null;
    for (let cols = 1; cols <= count; cols++){
      if (heroExtra > 0 && cols < 2) continue; // hero needs 2 columns to span
      const rows = Math.ceil(effective / cols);
      if (heroExtra > 0 && rows < 2) continue; // hero needs 2 rows to span
      const tileW = (containerW - GRID_GAP * (cols - 1)) / cols;
      if (tileW <= 0) continue;
      const tileH = tileW / TILE_ASPECT + TILE_BAR_H;
      const totalH = tileH * rows + GRID_GAP * (rows - 1);
      if (totalH <= containerH + 0.5 && (!best || tileW > best.tileW)){
        best = { cols, rows, tileW, tileH };
      }
    }
    if (best) return best;
    if (heroExtra > 0) return null; // let the caller retry without a hero
    // Nothing fit height-wise even with one tile per row (a very short
    // viewport) — fall back to exactly one row and shrink tiles to
    // whatever height is actually available, then re-check width.
    const rows = 1, cols = count;
    let tileH = Math.max(TILE_BAR_H + 20, (containerH - GRID_GAP * (rows - 1)) / rows);
    let tileW = (tileH - TILE_BAR_H) * TILE_ASPECT;
    const neededW = tileW * cols + GRID_GAP * (cols - 1);
    if (neededW > containerW){
      tileW = (containerW - GRID_GAP * (cols - 1)) / cols;
      tileH = tileW / TILE_ASPECT + TILE_BAR_H;
    }
    return { cols, rows, tileW, tileH };
  }

  // ---- desk-setup 3D tilt ----------------------------------------------
  // The #1 tile (hero) sits flat and slightly RECEDED, like the flat
  // center panel of a curved multi-monitor desk mount; the rest tilt
  // toward the viewer the further they are from center, like the angled
  // side panels of that same mount. Measures actual post-layout
  // positions rather than predicting CSS Grid's placement, so it works
  // regardless of how dense auto-flow packed things.
  const MAX_TILT_DEG = 17;
  const HERO_RECEDE_PX = 46;
  const SIDE_ADVANCE_PX = 16;

  function applyDeskTilt(heroLogin){
    const tiles = Array.from(gridEl.querySelectorAll(".tile"));
    if (!tiles.length) return;
    // .tile has a `transition: transform .5s ease` (for smooth hero swaps
    // and resizes). That's a problem here: fitTiltedGridToBounds(), called
    // right after this function, measures getBoundingClientRect() on these
    // same tiles to decide whether a corrective shrink is needed — and if
    // the transform change is still mid-transition at that moment, it
    // measures a PARTIALLY tilted position, not the final one. That
    // undersizes the measured union and lets the fully-settled (post
    // transition) tilt bulge past the safe box a few hundred ms later,
    // which is exactly the clipping this function exists to prevent.
    // Suppress the transition for this tilt+measure pass so the new
    // transform applies instantly and reflects the true final geometry,
    // then restore it so later changes (next render's tilt, a resize)
    // still animate smoothly.
    tiles.forEach(t => { t.style.transition = "none"; });
    // Clear transforms before measuring so rects reflect pure grid
    // layout, not whatever tilt was applied on the previous pass.
    tiles.forEach(t => { t.style.transform = "none"; });
    void gridEl.offsetHeight; // force a reflow
    const gridRect = gridEl.getBoundingClientRect();
    const centerX = gridRect.left + gridRect.width / 2;
    const halfW = (gridRect.width / 2) || 1;
    tiles.forEach(tile => {
      if (heroLogin && tile.dataset.login === heroLogin){
        tile.style.transform = "translateZ(-" + HERO_RECEDE_PX + "px)";
        return;
      }
      const r = tile.getBoundingClientRect();
      const norm = Math.max(-1, Math.min(1, ((r.left + r.width / 2) - centerX) / halfW));
      // Negated: a tile's edge NEAREST the center should angle toward the
      // viewer (like a curved desk array wrapping around them), not away
      // from it — the un-negated sign turned the outer edges forward
      // instead, which read as curving the wrong way.
      tile.style.transform = "translateZ(" + SIDE_ADVANCE_PX + "px) rotateY(" + (-norm * MAX_TILT_DEG).toFixed(2) + "deg)";
    });
    // Force the (transition-less) transform above to actually commit
    // before fitTiltedGridToBounds measures it.
    void gridEl.offsetHeight;
  }

  // Re-enables the transform transition on all tiles after a tilt+measure
  // pass has committed its final geometry (see applyDeskTilt). Deferred to
  // the next frame so restoring it can never itself be seen as a snap.
  function restoreTileTransitions(){
    requestAnimationFrame(() => {
      gridEl.querySelectorAll(".tile").forEach(t => { t.style.transition = ""; });
    });
  }

  function layoutGrid(visibleLogins){
    if (visibleLogins == null) visibleLogins = lastVisible;
    lastVisible = visibleLogins;
    const count = visibleLogins.length;
    if (!count) return;

    // A previous pass may have left a corrective scale() on #gridStage (see
    // fitTiltedGridToBounds below) — clear it before measuring, or this
    // read sees an already-shrunk box and undersizes everything, which
    // then throws off the overflow math on the next pass too.
    gridStageEl.style.transform = "";
    const rect = gridStageEl.getBoundingClientRect();
    const wantHero = count >= HERO_MIN_COUNT;
    let best = wantHero ? computeBestGrid(rect.width, rect.height, count, HERO_EXTRA_SLOTS) : null;
    const heroActive = !!best;
    if (!best) best = computeBestGrid(rect.width, rect.height, count, 0);
    if (!best) return;

    const heroLogin = heroActive ? visibleLogins[0] : null;
    gridEl.style.gridAutoFlow = heroActive ? "dense" : "row";
    gridEl.style.gridTemplateColumns = "repeat(" + best.cols + ", " + best.tileW.toFixed(1) + "px)";
    gridEl.style.gridAutoRows = best.tileH.toFixed(1) + "px";

    const heroColStart = heroActive ? Math.max(1, Math.floor((best.cols - 2) / 2) + 1) : null;
    const heroRowStart = heroActive ? Math.max(1, Math.floor((best.rows - 2) / 2) + 1) : null;

    gridEl.querySelectorAll(".tile").forEach(tile => {
      const isHero = heroActive && tile.dataset.login === heroLogin;
      tile.classList.toggle("hero", isHero);
      if (isHero){
        tile.style.gridColumn = heroColStart + " / span 2";
        tile.style.gridRow = heroRowStart + " / span 2";
      } else {
        tile.style.gridColumn = "";
        tile.style.gridRow = "";
      }
    });

    applyDeskTilt(heroLogin);
    fitTiltedGridToBounds();
    restoreTileTransitions();
  }

  // The desk tilt above makes the outer edges of angled tiles bulge
  // toward the viewer (translateZ + rotateY), which can visually push
  // them past #grid's own box and get clipped by the viewport or a
  // clipping ancestor — the fit-to-screen sizing upstream has no way to
  // predict that bulge since it's a 3D compositing effect, not a layout
  // change. Rather than guess a safe margin, measure what actually got
  // painted (post-tilt) and scale the whole grid down just enough to
  // bring it back inside its own untransformed box, if needed.
  //
  // The corrective scale is applied to #gridStage, NOT #grid itself:
  // #grid establishes `perspective` for its tilted tile children, and
  // scaling the same element that also sets perspective composes the
  // two transforms in a way that does not behave like a simple uniform
  // 2D shrink of what's visually painted (the measured union barely
  // moved even after a scale() was applied directly to #grid). #gridStage
  // is a plain flex wrapper with no perspective/transform of its own, so
  // scaling it shrinks the already-projected 3D scene as expected.
  function fitTiltedGridToBounds(){
    gridStageEl.style.transform = "";
    const tiles = Array.from(gridEl.querySelectorAll(".tile"));
    if (!tiles.length) return;
    const safe = gridStageEl.getBoundingClientRect();
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    tiles.forEach(t => {
      const r = t.getBoundingClientRect();
      if (r.left < minX) minX = r.left;
      if (r.top < minY) minY = r.top;
      if (r.right > maxX) maxX = r.right;
      if (r.bottom > maxY) maxY = r.bottom;
    });
    if (maxX <= minX || maxY <= minY || safe.width <= 0 || safe.height <= 0) return;
    // A CSS scale() transform shrinks around its transform-origin, which
    // defaults to #gridStage's own center — NOT the tile union's center.
    // The tile union isn't reliably centered inside #gridStage (an odd
    // column/row count, or the hero tile's off-center placement, can
    // shift it), so comparing raw union width/height to safe's box isn't
    // enough: a point that's e.g. 40px right of center before scaling is
    // still 40px*scale right of that SAME center point after, regardless
    // of how the opposite edge behaves. Measure each edge's distance from
    // the origin independently and make sure the worst-case one still
    // lands inside the safe box post-scale.
    const originX = safe.left + safe.width / 2;
    const originY = safe.top + safe.height / 2;
    const maxAbsX = Math.max(Math.abs(minX - originX), Math.abs(maxX - originX));
    const maxAbsY = Math.max(Math.abs(minY - originY), Math.abs(maxY - originY));
    if (maxAbsX <= 0 || maxAbsY <= 0) return;
    // A small safety shrink (not just clamping to exactly 1:1) so
    // sub-pixel rounding from the measurement pass never leaves a
    // tile's edge a hair past the boundary.
    const scale = Math.min(1, (safe.width / 2 / maxAbsX) * 0.995, (safe.height / 2 / maxAbsY) * 0.995);
    if (scale < 0.999){
      gridStageEl.style.transform = "scale(" + scale.toFixed(4) + ")";
    } else {
      gridStageEl.style.transform = "";
    }
  }

  let resizeRAF = null;
  window.addEventListener("resize", () => {
    if (resizeRAF) cancelAnimationFrame(resizeRAF);
    resizeRAF = requestAnimationFrame(() => layoutGrid());
  });

  function showBanner(msg){
    bannerEl.textContent = msg;
    bannerEl.classList.add("show");
  }
  function clearBanner(){ bannerEl.classList.remove("show"); }

  function fmtViewers(n){
    if (n >= 1000) return (n/1000).toFixed(n >= 10000 ? 0 : 1) + "K";
    return String(n);
  }

  // Same telemetry the map shows for a confirmed-online Belabox encoder
  // (bitrate + SoC temp) — used both for the "warming up" placeholder
  // tile and, when a login is already live on Twitch/Kick AND its
  // encoder is separately confirmed on, a small badge on that tile too.
  function fmtBitrate(kbps){
    if (kbps == null) return "";
    return kbps >= 1000 ? (kbps/1000).toFixed(1) + " Mbps" : kbps + " Kbps";
  }
  function telemetryText(t){
    if (!t) return "";
    const parts = [];
    if (t.tempF != null) parts.push(t.tempF + "°F");
    if (t.bitrateKbps != null) parts.push(fmtBitrate(t.bitrateKbps));
    return parts.join(" · ");
  }

  function twitchSrc(login, muted){
    const params = new URLSearchParams();
    params.set("channel", login);
    params.set("muted", muted ? "true" : "false");
    params.set("autoplay", "true");
    let qs = params.toString();
    TWITCH_PARENTS.forEach(p => { qs += "&parent=" + encodeURIComponent(p); });
    return "https://player.twitch.tv/?" + qs;
  }
  function kickSrc(login, muted){
    return "https://player.kick.com/" + encodeURIComponent(login) +
      "?muted=" + (muted ? "true" : "false") + "&autoplay=true";
  }
  function channelUrl(login, platform){
    return platform === "kick"
      ? "https://kick.com/" + login
      : "https://twitch.tv/" + login;
  }

  function beaconClick(login, platform){
    try{
      const payload = JSON.stringify({ login, platform, source: "wall", ts: Date.now() });
      if (navigator.sendBeacon){
        navigator.sendBeacon(WORKER_BASE + "/click", payload);
      } else {
        fetch(WORKER_BASE + "/click", { method:"POST", body: payload, keepalive:true });
      }
    } catch(e){ /* best-effort only */ }
  }

  // ---- data fetching ---------------------------------------------------
  async function fetchLive(){
    const r = await fetch(WORKER_BASE + "/", { cache: "no-store" });
    const j = await r.json();
    if (j.error && (!j.live || !j.live.length)) throw new Error(j.error);
    return j.live || [];
  }
  async function fetchAvatars(){
    const r = await fetch(WORKER_BASE + "/avatars", { cache: "no-store" });
    const j = await r.json();
    return { avatars: j.avatars || {}, names: j.names || {} };
  }

  // ---- rendering --------------------------------------------------------
  // Builds/updates DOM tiles. Crucially, a tile whose login is already on
  // screen is left alone (never re-created, never has its iframe src
  // touched) unless the audio focus changes for it — that's what keeps a
  // playing stream from stuttering every time the 60s poll runs or the
  // wall is expanded.

  function tileTemplate(entry){
    const wrap = document.createElement("div");
    wrap.className = "tile";
    wrap.dataset.login = entry.login;

    // The bezel (`.tile` itself) is just plastic-colored chrome; all the
    // actual screen content sits in this nested `.screen` — same trick a
    // real monitor uses (bezel frame vs. the glass inside it), and it's
    // what gets the rounded "glass" corners instead of the outer bezel.
    const screen = document.createElement("div");
    screen.className = "screen";
    wrap.appendChild(screen);

    const led = document.createElement("div");
    led.className = "led";
    wrap.appendChild(led);

    const badge = document.createElement("div");
    badge.className = "badge " + entry.platform;
    badge.textContent = entry.platform;
    screen.appendChild(badge);

    const frameWrap = document.createElement("div");
    frameWrap.className = "frame-wrap";
    const reticleR = document.createElement("div");
    reticleR.className = "reticle-r";
    frameWrap.appendChild(reticleR);
    const sheen = document.createElement("div");
    sheen.className = "sheen";
    frameWrap.appendChild(sheen);

    if (entry.platform === "encoder"){
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.innerHTML =
        '<div class="spin"></div>' +
        '<div>encoder online — waiting for stream…</div>' +
        '<div class="tele">' + telemetryText(entry.telemetry) + '</div>';
      frameWrap.appendChild(ph);
    } else {
      const iframe = document.createElement("iframe");
      iframe.allow = "autoplay; fullscreen";
      iframe.allowFullscreen = true;
      iframe.src = entry.platform === "kick"
        ? kickSrc(entry.login, entry.login !== audioFocusLogin)
        : twitchSrc(entry.login, entry.login !== audioFocusLogin);
      frameWrap.appendChild(iframe);

      // Live on a platform AND the Belabox encoder is separately
      // confirmed on (encoderConfirmed) — show its bitrate/temp the same
      // way the map does, as a small corner badge rather than replacing
      // the video.
      if (entry.encoderConfirmed && entry.telemetry){
        const tele = document.createElement("div");
        tele.className = "tele-badge";
        tele.textContent = telemetryText(entry.telemetry);
        frameWrap.appendChild(tele);
      }
    }
    screen.appendChild(frameWrap);

    const bar = document.createElement("div");
    bar.className = "bar";

    const av = document.createElement("img");
    av.className = "avatar";
    av.loading = "lazy";
    av.src = avatars[entry.login] || "";
    av.alt = "";
    bar.appendChild(av);

    const who = document.createElement("div");
    who.className = "who";
    const nameEl = document.createElement("b");
    nameEl.textContent = names[entry.login] || entry.name || entry.login;
    who.appendChild(nameEl);
    if (entry.title){
      const titleEl = document.createElement("div");
      titleEl.className = "title";
      titleEl.textContent = entry.title;
      who.appendChild(titleEl);
    }
    bar.appendChild(who);

    if (entry.platform !== "encoder"){
      const viewers = document.createElement("div");
      viewers.className = "viewers";
      viewers.innerHTML = '<span class="liveDot"></span><span class="vnum"></span>';
      viewers.querySelector(".vnum").textContent = fmtViewers(entry.viewers || 0);
      bar.appendChild(viewers);

      const soundBtn = document.createElement("button");
      soundBtn.className = "icon-btn sound-btn";
      soundBtn.title = "Toggle audio focus";
      soundBtn.textContent = entry.login === audioFocusLogin ? "🔊" : "🔇";
      soundBtn.addEventListener("click", () => setAudioFocus(entry.login));
      bar.appendChild(soundBtn);
    }

    const openBtn = document.createElement("button");
    openBtn.className = "icon-btn";
    openBtn.title = "Open channel";
    openBtn.textContent = "↗";
    openBtn.addEventListener("click", () => {
      beaconClick(entry.login, entry.platform);
      window.open(channelUrl(entry.login, entry.platform), "_blank", "noopener");
    });
    bar.appendChild(openBtn);

    screen.appendChild(bar);
    return wrap;
  }

  function setAudioFocus(login){
    audioFocusLogin = (audioFocusLogin === login) ? null : login;
    // Only the tiles whose focus state actually changed need their
    // iframe reloaded with a new `muted` param — everyone else stays put.
    order.slice(0, visibleCount).forEach(l => {
      const entry = liveByLogin.get(l);
      if (!entry || entry.platform === "encoder") return;
      const tile = gridEl.querySelector('.tile[data-login="' + cssEscape(l) + '"]');
      if (!tile) return;
      const shouldBeUnmuted = (l === audioFocusLogin);
      tile.classList.toggle("audio-focus", shouldBeUnmuted);
      const iframe = tile.querySelector("iframe");
      const btn = tile.querySelector(".sound-btn");
      const currentlyUnmuted = iframe && iframe.src.indexOf("muted=false") !== -1;
      if (iframe && shouldBeUnmuted !== !!currentlyUnmuted){
        iframe.src = entry.platform === "kick"
          ? kickSrc(l, !shouldBeUnmuted)
          : twitchSrc(l, !shouldBeUnmuted);
      }
      if (btn) btn.textContent = shouldBeUnmuted ? "🔊" : "🔇";
    });
  }

  function cssEscape(s){
    return String(s).replace(/[^a-zA-Z0-9_-]/g, m => "\\" + m);
  }

  function render(){
    const visible = order.slice(0, visibleCount);
    const visibleSet = new Set(visible);

    // Remove tiles that fell off the wall (went offline, or pushed past
    // the current tier).
    gridEl.querySelectorAll(".tile").forEach(tile => {
      if (!visibleSet.has(tile.dataset.login)) tile.remove();
    });

    // Rank changes (viewer counts shift constantly) are applied purely
    // via the CSS `order` property below, NOT by moving DOM nodes.
    // Moving an already-attached iframe with appendChild — even to
    // reorder it among siblings it's already sitting next to — makes
    // some browsers treat it as a detach+reattach and reload it, which
    // was stopping every playing stream on each 60s poll. A brand-new
    // tile is still appended once, normally, since nothing is playing in
    // it yet.
    visible.forEach((login, idx) => {
      let tile = gridEl.querySelector('.tile[data-login="' + cssEscape(login) + '"]');
      const entry = liveByLogin.get(login);
      if (!tile){
        tile = tileTemplate(entry);
        gridEl.appendChild(tile);
      } else {
        // Update only the bits that change every poll (viewer count,
        // title, encoder telemetry) — never the iframe, never the node's
        // position in the DOM.
        const vnum = tile.querySelector(".vnum");
        if (vnum) vnum.textContent = fmtViewers(entry.viewers || 0);
        const titleEl = tile.querySelector(".title");
        if (titleEl && entry.title) titleEl.textContent = entry.title;

        if (entry.platform === "encoder"){
          const teleEl = tile.querySelector(".placeholder .tele");
          if (teleEl) teleEl.textContent = telemetryText(entry.telemetry);
        } else {
          let teleBadge = tile.querySelector(".tele-badge");
          if (entry.encoderConfirmed && entry.telemetry){
            if (!teleBadge){
              teleBadge = document.createElement("div");
              teleBadge.className = "tele-badge";
              tile.querySelector(".frame-wrap").appendChild(teleBadge);
            }
            teleBadge.textContent = telemetryText(entry.telemetry);
          } else if (teleBadge){
            teleBadge.remove();
          }
        }
      }
      tile.style.order = idx;
    });

    emptyEl.classList.toggle("show", order.length === 0);
    gridEl.style.display = order.length === 0 ? "none" : "grid";
    layoutGrid(visible);

    $("#liveCount").textContent = fullOrder.length;
    $("#shownCount").textContent = visible.length;

    // "Up next" chips + Show more button.
    const remaining = order.slice(visibleCount);
    moreBtn.style.display = remaining.length ? "inline-flex" : "none";
    const nextTier = TIERS.find(t => t > visibleCount) || null;
    moreBtn.textContent = nextTier
      ? "Show more (" + Math.min(nextTier, order.length) + " of " + order.length + ")"
      : "Show all " + order.length;

    upNextEl.innerHTML = "";
    remaining.slice(0, 12).forEach(login => {
      const entry = liveByLogin.get(login);
      const chip = document.createElement("div");
      chip.className = "chip";
      const img = document.createElement("img");
      img.src = avatars[login] || "";
      img.alt = "";
      chip.appendChild(img);
      const b = document.createElement("b");
      b.textContent = names[login] || login;
      chip.appendChild(b);
      chip.appendChild(document.createTextNode(fmtViewers(entry.viewers || 0)));
      upNextEl.appendChild(chip);
    });

    // Nothing to show below the wall? Collapse the footer entirely so
    // its (empty) space doesn't eat into the grid's available height.
    const footerHasContent = remaining.length > 0;
    footerEl.classList.toggle("empty", !footerHasContent);
    // Collapsing/expanding the footer changes how much height the grid
    // actually has — re-run the fit once more after layout settles.
    if (typeof requestAnimationFrame === "function"){
      requestAnimationFrame(() => layoutGrid(visible));
    }
  }

  function rebuildGridSizeOptions(){
    const total = order.length;
    const opts = TIERS.filter(t => t < total);
    opts.push(total);
    const wasValue = visibleCount;
    gridSizeSel.innerHTML = "";
    opts.forEach(n => {
      const o = document.createElement("option");
      o.value = n;
      o.textContent = "Top " + n;
      gridSizeSel.appendChild(o);
    });
    if (!opts.includes(visibleCount)){
      visibleCount = opts.includes(4) ? 4 : (opts[0] || 0);
    }
    gridSizeSel.value = String(visibleCount);
  }

  // ---- polling ------------------------------------------------------
  async function refreshLive(){
    try{
      const live = await fetchLive();
      live.sort((a,b) => (b.viewers||0) - (a.viewers||0));
      liveByLogin = new Map(live.map(e => [e.login, e]));
      fullOrder = live.map(e => e.login);
      applyFilter();
      clearBanner();
    } catch(err){
      showBanner("Couldn't reach the live worker (" + (err && err.message ? err.message : err) + "). Retrying…");
    }
    rebuildGridSizeOptions();
    render();
    $("#updatedAt").textContent = "updated " + new Date().toLocaleTimeString();
  }

  async function refreshAvatars(){
    try{
      const a = await fetchAvatars();
      avatars = a.avatars; names = a.names;
      render();
    } catch(err){ /* non-fatal; names/logins still show */ }
  }

  // ---- wiring ---------------------------------------------------------
  const irlCheckbox = $("#irlOnly");
  irlCheckbox.checked = irlOnly;
  irlCheckbox.addEventListener("change", () => {
    irlOnly = irlCheckbox.checked;
    try { localStorage.setItem("mushbox_irlOnly", irlOnly ? "1" : "0"); } catch(e){}
    applyFilter();
    rebuildGridSizeOptions();
    render();
  });

  gridSizeSel.addEventListener("change", () => {
    visibleCount = parseInt(gridSizeSel.value, 10) || 4;
    render();
  });
  moreBtn.addEventListener("click", () => {
    const nextTier = TIERS.find(t => t > visibleCount);
    visibleCount = nextTier ? Math.min(nextTier, order.length) : order.length;
    gridSizeSel.value = String(visibleCount);
    render();
  });
  $("#refreshBtn").addEventListener("click", () => { refreshLive(); });

  refreshAvatars();
  refreshLive();
  refreshTimer = setInterval(refreshLive, POLL_MS);
  setInterval(refreshAvatars, AVATAR_POLL_MS);
})();
</script>
</body>
</html>
