<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ============================================================
     SEO / social preview tags — copied verbatim from the current
     homepage so link previews (Twitter/X, Discord, iMessage, etc.)
     on themushbox.com still show the real Mushbox card, not a
     blank splash. If you update these on the homepage later,
     mirror the change here too.
     ============================================================ -->
<title>Mushr00msauce — IRL Streamer · Mushbox</title>
<meta name="description" content="Mushr00msauce — IRL streamer, builder of Mushbox bonded streaming rigs. Twitch, socials, and setup guides.">
<link rel="canonical" href="https://themushbox.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mushbox">
<meta property="og:title" content="Mushbox — bonded IRL streaming rigs, built by hand">
<meta property="og:description" content="Hand-built Belabox-style bonding rigs for IRL streamers — and a family of creators who keep finding each other. Guides, roster, and how to get your own.">
<meta property="og:url" content="https://themushbox.com/">
<meta property="og:image" content="https://themushbox.com/assets/og-family-nyc.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Three Mushbox family members meeting up on a New York City street at night">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Mushbox — bonded IRL streaming rigs, built by hand">
<meta name="twitter:description" content="Hand-built bonding rigs for IRL streamers — and a family of creators who keep finding each other IRL.">
<meta name="twitter:image" content="https://themushbox.com/assets/og-family-nyc.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #060810;
    --panel: #0A1535;
    --royal: #1E6FFF;
    --sky: #4DB8FF;
    --white: #ffffff;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    position: relative;
  }

  /* ambient brand glow behind the video */
  .glow{
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 40%, rgba(30,111,255,0.35), transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 75%, rgba(77,184,255,0.18), transparent 65%);
    pointer-events: none;
  }

  .stage{
    position: relative;
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  video{
    position: relative;
    max-width: 100vw;
    max-height: 100dvh;
    width: auto;
    height: 100%;
    object-fit: contain;
    background: #000;
    z-index: 1;
    box-shadow: 0 0 80px rgba(30,111,255,0.25);
  }

  .wordmark{
    position: absolute;
    top: max(24px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    letter-spacing: 0.12em;
    font-size: clamp(14px, 3vw, 18px);
    color: var(--white);
    opacity: 0;
    animation: fadeIn 0.8s ease 0.2s forwards;
    text-shadow: 0 0 20px rgba(30,111,255,0.6);
  }
  .wordmark span{ color: var(--sky); }

  .progress-track{
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: min(260px, 60vw);
    height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
    z-index: 3;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--royal), var(--sky));
    border-radius: 2px;
  }

  .controls{
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    right: max(18px, env(safe-area-inset-right));
    z-index: 3;
    display: flex;
    gap: 8px;
  }

  button.ctrl{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 14px;
    color: var(--white);
    background: rgba(10,21,53,0.55);
    border: 1px solid rgba(77,184,255,0.35);
    backdrop-filter: blur(6px);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button.ctrl:hover{
    background: rgba(30,111,255,0.35);
    border-color: var(--sky);
  }
  button.ctrl:active{ transform: scale(0.96); }

  .fade-out{
    animation: fadeOut 0.45s ease forwards;
  }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateX(-50%) translateY(-6px); }
    to{ opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes fadeOut{
    from{ opacity: 1; }
    to{ opacity: 0; }
  }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

  <h1 class="sr-only">Mushbox — hand-built bonded IRL streaming rigs</h1>

  <div class="glow"></div>

  <div class="wordmark">MUSH<span>BOX</span></div>

  <div class="controls">
    <button id="soundBtn" class="ctrl" aria-label="Mute video">🔊 Sound</button>
    <button id="skipBtn" class="ctrl" aria-label="Skip intro">Skip ›</button>
  </div>

  <div class="stage" id="stage">
    <video
      id="revealVideo"
      src="assets/videos/mushbox-cage-reveal.mp4"
      poster="assets/videos/mushbox-cage-reveal-poster.jpg"
      autoplay
      playsinline
      preload="auto"
    ></video>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <script>
    (function () {
      var DESTINATION = 'home.html';   // where the full site lives after the reveal
      var MAX_WAIT_MS = 13000;         // hard safety net if the video can't load/play at all
      var advanced = false;

      var video = document.getElementById('revealVideo');
      var progressFill = document.getElementById('progressFill');
      var soundBtn = document.getElementById('soundBtn');
      var skipBtn = document.getElementById('skipBtn');
      var body = document.body;

      function go() {
        if (advanced) return;
        advanced = true;
        body.classList.add('fade-out');
        setTimeout(function () {
          window.location.replace(DESTINATION);
        }, 420);
      }

      // Advance as soon as the reveal finishes playing.
      video.addEventListener('ended', go);

      // Safety net: if autoplay is blocked, the file is slow, or it errors out,
      // don't strand anyone on the splash — move on anyway.
      video.addEventListener('error', go);
      var fallbackTimer = setTimeout(go, MAX_WAIT_MS);

      // Live progress bar.
      video.addEventListener('timeupdate', function () {
        if (!video.duration) return;
        var pct = (video.currentTime / video.duration) * 100;
        progressFill.style.width = pct + '%';
      });

      // Manual skip.
      skipBtn.addEventListener('click', function () {
        clearTimeout(fallbackTimer);
        go();
      });

      function updateSoundBtn() {
        soundBtn.textContent = video.muted ? '🔇 Sound' : '🔊 Sound';
        soundBtn.setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video');
      }

      soundBtn.addEventListener('click', function () {
        video.muted = !video.muted;
        if (!video.muted) {
          video.play().catch(function () {});
        }
        updateSoundBtn();
      });

      // Try to autoplay WITH sound. Most browsers only allow this once a
      // visitor has already interacted with the site (or this domain has
      // built up enough "media engagement"), so if the browser refuses,
      // fall back to a muted autoplay instead of stalling the reveal —
      // the Sound button still lets people turn audio on themselves.
      function attemptPlay() {
        video.muted = false;
        var playPromise = video.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () {
            video.muted = true;
            video.play().catch(function () {});
            updateSoundBtn();
          });
        }
        updateSoundBtn();
      }
      attemptPlay();

      // Some mobile browsers pause autoplay video when it's not yet in view/ready — nudge it.
      video.addEventListener('canplay', function () {
        video.play().catch(function () {});
      });
    })();
  </script>
</body>
</html>
