<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mushbox — Live Map</title>
<meta name="description" content="A live map of the Mushbox family — see where IRL streamers are broadcasting right now.">
<meta property="og:title" content="Mushbox — Live Map">
<meta property="og:description" content="See where the Mushbox family is streaming live right now.">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --black:#060810; --navy:#0A1535; --royal:#1E6FFF; --sky:#4DB8FF; --white:#fff;
    --red:#ff3b4e; --red-soft:#ff5a6a;
    --twitch:#9146FF; --twitch-soft:#a970ff; --kick:#53FC18; --kick-soft:#78ff45;
    --amber:#F5A623; --amber-soft:#ffbf4d;
    --edge:rgba(77,184,255,.28);
    --panel:rgba(10,21,53,.82);
    --dim:#7f92b8;
    --font:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--black);color:var(--white);font-family:var(--font);}
  #map{position:fixed;inset:0;background:var(--black);z-index:0;}

  .leaflet-container{background:#05070e;font-family:var(--font);}
  .leaflet-control-attribution{background:rgba(6,8,16,.7)!important;color:#5b6b8f!important;font-size:10px;}
  .leaflet-control-attribution a{color:#7f92b8!important;}
  .leaflet-bar a{background:var(--navy);color:#cfe0ff;border-color:rgba(77,184,255,.25);}
  .leaflet-bar a:hover{background:var(--royal);color:#fff;}

  .console{
    position:fixed;z-index:1000;top:14px;left:14px;width:min(340px,calc(100vw - 28px));
    background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--edge);border-radius:16px;padding:14px 15px 12px;
    box-shadow:0 22px 50px -24px rgba(0,0,0,.85);
  }
  .console h1{
    margin:0;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--white);display:flex;align-items:center;gap:9px;
  }
  .brandmark{color:var(--sky)}
  .brandmark-logo{height:22px;width:auto;display:block;flex:0 0 auto;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));}
  .console h1 .brandsub{color:var(--dim);font-weight:700}
  .count{
    margin:11px 0 2px;font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;
    letter-spacing:-.01em;display:flex;align-items:baseline;gap:9px;
  }
  .count .n{color:var(--white)}
  .count.is-live .n{color:var(--sky)}
  .count .lbl{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .livedot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#39507f;flex:0 0 auto;align-self:center;}
  .is-live .livedot{background:var(--sky);box-shadow:0 0 0 0 rgba(77,184,255,.7);animation:ping 1.8s ease-out infinite;}

  .meta{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .meta button{font-family:var(--mono);font-size:10.5px;color:#cfe0ff;background:rgba(30,111,255,.16);
    border:1px solid rgba(77,184,255,.3);border-radius:999px;padding:4px 10px;cursor:pointer;}
  .meta button:hover{background:var(--royal);color:#fff;border-color:var(--royal)}

  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid rgba(77,184,255,.14);font-size:11px;color:var(--dim)}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .legend .lg-tw{background:var(--twitch);box-shadow:0 0 8px var(--twitch)}
  .legend .lg-kick{background:var(--kick);box-shadow:0 0 8px var(--kick)}
  .legend .lg-live{background:var(--sky);box-shadow:0 0 8px var(--sky)}
  .legend .lg-amber{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .legend .lg-off{background:#39507f}
  .legend .lg-pin{color:var(--dim)}
  .toggle{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--royal)}

  .live-list{
    position:fixed;z-index:1000;left:14px;bottom:14px;width:min(340px,calc(100vw - 28px));
    max-height:38vh;overflow-y:auto;overflow-x:hidden;background:var(--panel);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--edge);border-radius:16px;padding:8px;
    box-shadow:0 22px 50px -24px rgba(0,0,0,.85);
  }
  .live-list:empty{display:none}
  .row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;
    text-decoration:none;color:inherit;transition:background .14s;}
  .row:hover,.row.hot{background:rgba(30,111,255,.16)}
  .row .beacon-mini{position:relative;width:12px;height:12px;flex:0 0 auto}
  .row .beacon-mini::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sky);box-shadow:0 0 8px var(--sky)}
  .row.irl .beacon-mini::after{background:var(--twitch);box-shadow:0 0 8px var(--twitch)}
  .row.irl.kick .beacon-mini::after{background:var(--kick);box-shadow:0 0 8px var(--kick)}
  .row.warming .beacon-mini::after{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .row .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
  .row .nm{font-weight:700;font-size:13.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
  .row .sub .pin{color:var(--sky)}
  .row .vw{font-family:var(--mono);font-size:11px;color:var(--sky);flex:0 0 auto;text-align:right}
  .row .vw small{display:block;color:var(--dim);font-size:9px;letter-spacing:.08em}

  .unmapped{padding:8px 11px;font-size:11px;color:var(--dim);font-family:var(--mono);border-top:1px solid rgba(77,184,255,.14);margin-top:4px}
  .unmapped b{color:#cfe0ff;font-weight:700}
  .empty{padding:16px 12px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.5}

  .beacon{position:relative;width:18px;height:18px}
  /* default beacon = BLUE = live (non-IRL category, i.e. "just live") */
  .beacon .core{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle at 40% 35%,#bfe0ff,var(--sky) 60%,var(--royal));
    box-shadow:0 0 10px 2px rgba(77,184,255,.9),0 0 22px 6px rgba(30,111,255,.55);z-index:2}
  .beacon .ring{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);
    border-radius:50%;border:2px solid rgba(77,184,255,.85);opacity:0;animation:beam 2.6s ease-out infinite}
  .beacon .ring.r2{animation-delay:1.3s}
  /* IRL tier = RED = live in an IRL category (a Mushbox stream) */
  .beacon.irl .core{background:radial-gradient(circle at 40% 35%,#e4d4ff,var(--twitch) 60%,#5a1fb0);
    box-shadow:0 0 11px 2px rgba(145,70,255,.95),0 0 24px 7px rgba(120,50,230,.5)}
  .beacon.irl .ring{border-color:rgba(169,112,255,.9)}
  .beacon.irl.kick .core{background:radial-gradient(circle at 40% 35%,#dcffd0,var(--kick) 60%,#2fae00);
    box-shadow:0 0 11px 2px rgba(83,252,24,.95),0 0 24px 7px rgba(60,220,10,.5)}
  .beacon.irl.kick .ring{border-color:rgba(120,255,69,.9)}
  /* WARMING = AMBER = encoder connected/transmitting but not yet showing
     live on Twitch/Kick (bonding, testing, about to go live). */
  .beacon.warming .core{background:radial-gradient(circle at 40% 35%,#fff0d0,var(--amber) 60%,#b97400);
    box-shadow:0 0 11px 2px rgba(245,166,35,.95),0 0 24px 7px rgba(245,166,35,.5)}
  .beacon.warming .ring{border-color:rgba(255,191,77,.9)}
  .beacon .pin{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font-size:12px;line-height:1;z-index:3;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .off-dot{width:10px;height:10px;border-radius:50%;background:#39507f;
    border:1px solid rgba(120,150,200,.5);box-shadow:0 0 5px rgba(20,40,80,.8);
    transition:background .14s,box-shadow .14s,transform .14s}
  /* bigger transparent tap/hover target around the small dot */
  .off-hit{width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .off-hit:hover .off-dot{background:#5a78b4;border-color:rgba(160,190,235,.85);
    box-shadow:0 0 9px rgba(70,120,215,.95);transform:scale(1.15)}

  /* offline hover card: avatar + name */
  .leaflet-tooltip.offtip{background:var(--navy);border:1px solid var(--edge);border-radius:13px;
    box-shadow:0 16px 38px -18px rgba(0,0,0,.9);padding:9px 10px 8px;color:#fff}
  .leaflet-tooltip-top.offtip::before{border-top-color:var(--navy)}
  .offtip .otwrap{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:78px;max-width:120px}
  .offtip .ava{width:54px;height:54px;border-radius:50%;object-fit:cover;display:block;
    border:2px solid var(--edge);background:#0c1533}
  .offtip .onm{font-family:var(--mono);font-size:11.5px;color:#cfe0ff;letter-spacing:.02em;
    max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .offtip .ost{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  /* live hover cards tint the avatar ring + sublabel to match the dot */
  .offtip .ava.live{border-color:var(--sky)}
  .offtip .ava.irl{border-color:var(--twitch-soft)}
  .offtip .ava.irl.kick{border-color:var(--kick-soft)}
  .offtip .ava.warming{border-color:var(--amber-soft)}
  .offtip .ost.live{color:var(--sky)}
  .offtip .ost.irl{color:var(--twitch-soft)}
  .offtip .ost.irl.kick{color:var(--kick-soft)}
  .offtip .ost.warming{color:var(--amber-soft)}

  @keyframes beam{0%{opacity:.8;width:12px;height:12px}70%{opacity:0}100%{opacity:0;width:52px;height:52px}}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(77,184,255,.7)}70%{box-shadow:0 0 0 9px rgba(77,184,255,0)}100%{box-shadow:0 0 0 0 rgba(77,184,255,0)}}

  .leaflet-popup-content-wrapper{background:var(--navy);color:#fff;border:1px solid var(--edge);border-radius:14px;box-shadow:0 18px 44px -18px rgba(0,0,0,.85)}
  .leaflet-popup-tip{background:var(--navy);border:1px solid var(--edge)}
  .leaflet-popup-content{margin:12px 14px;font-family:var(--font)}
  .pop .phead{display:flex;align-items:center;gap:11px;margin:0 0 8px}
  .pop .phead .ptext{min-width:0}
  .pop .pava{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;display:block;
    border:2px solid var(--edge);background:#0c1533}
  .pop .pava.live{border-color:var(--sky)}
  .pop .pava.irl{border-color:var(--twitch-soft)}
  .pop .pava.irl.kick{border-color:var(--kick-soft)}
  .pop .pava.warming{border-color:var(--amber-soft)}
  .pop .pconfirmed{font-size:11px;color:var(--amber-soft);margin:0 0 6px;font-family:var(--mono)}
  .pop .pnm{font-weight:700;font-size:15px;margin:0 0 2px}
  .pop .phead .pnm{margin:0}
  .pop .pcity{font-family:var(--mono);font-size:11px;color:var(--sky);letter-spacing:.04em;margin-bottom:2px}
  .pop .palt{font-size:11px;color:var(--sky);margin:0 0 6px;font-family:var(--mono)}
  .pop .psrc{font-size:10.5px;color:var(--dim);margin:0 0 8px;letter-spacing:.02em}
  .pop .pcat{font-size:12px;color:#cfe0ff;margin:0 0 3px}
  .pop .pvw{font-family:var(--mono);font-size:12px;color:var(--dim);margin:0 0 10px}
  .pop a.watch{display:inline-block;background:var(--royal);color:#fff;text-decoration:none;font-weight:700;
    font-size:12.5px;padding:7px 14px;border-radius:999px}
  .pop a.watch:hover{background:var(--sky);color:#04122b}

  @media (max-width:720px){
    .console{top:10px;left:10px}
    .live-list{left:10px;bottom:10px;max-height:32vh}
  }
  @media (prefers-reduced-motion:reduce){
    .beacon .ring{display:none}
    .beacon .core{box-shadow:0 0 8px 2px rgba(77,184,255,.9)}
    .beacon.irl .core{box-shadow:0 0 8px 2px rgba(145,70,255,.95)}
    .beacon.irl.kick .core{box-shadow:0 0 8px 2px rgba(83,252,24,.95)}
    .livedot{animation:none}
  }

  /* Back to the family wall — top-right, clear of the console (top-left),
     zoom (bottom-right) and live list (bottom-left). */
  .backbtn{
    position:fixed;z-index:1000;top:14px;right:14px;
    display:inline-flex;align-items:center;gap:7px;
    background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--edge);border-radius:999px;padding:9px 15px 9px 12px;
    color:#cfe0ff;text-decoration:none;font-weight:700;font-size:12.5px;letter-spacing:.05em;
    box-shadow:0 22px 50px -24px rgba(0,0,0,.85);
    transition:background .14s,color .14s,border-color .14s;
  }
  .backbtn:hover{background:var(--royal);color:#fff;border-color:var(--royal)}
  .backbtn .arw{font-size:15px;line-height:1;transform:translateY(-1px)}
  @media (max-width:720px){ .backbtn{top:10px;right:10px;padding:8px 13px 8px 11px} }

  /* EMBED MODE — thumbnail preview for the family-wall LIVE MAP card.
     Hide the chrome, keep just the dark map + live dots. Attribution stays
     (tile-provider terms) but is nudged smaller and quieter. */
  html.embed, html.embed body{background:transparent}
  html.embed .console,
  html.embed .live-list,
  html.embed .backbtn,
  html.embed .leaflet-control-zoom{display:none!important}
  html.embed .leaflet-control-attribution{font-size:8px;opacity:.5;padding:0 3px}
</style>
</head>

        : '🏠 Home base · location not in title');
    var altLine = (e.person && e.login && e.login !== e.person)
      ? '<p class="palt">on @'+esc(e.login)+' (2nd channel)</p>' : '';
    var ring = e.warming ? 'warming' : (e.irl ? (e.platform==='kick'?'irl kick':'irl') : 'live');
    var aurl = AVATARS[e.login] || AVATARS[e.person] || '';
    var ava  = aurl
      ? '<img class="pava '+ring+'" src="'+esc(aurl)+'" alt="" onerror="this.remove()">'
      : '';
    // Confirmed badge: shown when a genuinely-live entry's encoder has also
    // been checked and is transmitting — proof it's a real broadcast, not a
    // stuck platform flag. Not shown for the warming state itself (redundant).
    var confirmedLine = (e.encoderConfirmed && !e.warming)
      ? '<p class="pconfirmed">✓ Encoder confirmed transmitting</p>' : '';
    var viewersLine = e.warming ? '' : ('<p class="pvw">'+fmtViewers(e.viewers)+' watching</p>');
    var watchLabel = e.warming ? 'View channel ▸' : 'Watch live ▸';
    return '<div class="pop">'
      + '<div class="phead">' + ava
      +   '<div class="ptext">'
      +     '<p class="pnm">'+esc(e.name)+'</p>'
      +     '<div class="pcity">'+esc(e.label)+'</div>'
      +   '</div>'
      + '</div>'
      + altLine
      + '<p class="psrc">'+srcLine+'</p>'
      + confirmedLine
      + (e.cat ? '<p class="pcat">'+esc(e.cat)+'</p>' : '')
      + viewersLine
      + '<a class="watch" href="'+watchURL(e.login, e.platform)+'" target="_blank" rel="noopener">'+watchLabel+'</a>'
      + '</div>';
  }

  // Hover card for a LIVE dot — same avatar+name card as offline, tinted
  // red (IRL) or blue (just-live) to match the beacon. Click still opens
  // the full popup (which now carries the avatar too).
  function liveTip(e){
    var ring = e.warming ? 'warming' : (e.irl ? (e.platform==='kick'?'irl kick':'irl') : 'live');
    var aurl = AVATARS[e.login] || AVATARS[e.person] || '';
    var disp = e.name || NAMES[e.login] || e.login;
    var img  = aurl
      ? '<img class="ava '+ring+'" src="'+esc(aurl)+'" alt="" onerror="this.remove()">'
      : '';
    var label = e.warming ? 'warming up' : (e.irl?'live · irl':'live');
    return '<div class="otwrap">'
      + img
      + '<span class="onm">' + esc(disp) + '</span>'
      + '<span class="ost '+ring+'">' + label + '</span>'
      + '</div>';
  }

  function renderOffline(show){
    Object.keys(offMarkers).forEach(function(k){ map.removeLayer(offMarkers[k]); });
    offMarkers = {};
    if(!show) return;
    Object.keys(HOMES).forEach(function(login){
      if(liveMarkers[login]) return; // don't double-draw someone who's live
      var loc = HOMES[login];
      var mk = L.marker([loc[0],loc[1]], { icon:offIcon(HOME_OFFSET[login]), keyboard:false, zIndexOffset:-500, riseOnHover:true });
      mk.bindTooltip((function(lg){ return function(){ return offTip(lg); }; })(login),
        {direction:'top', className:'offtip', opacity:1, offset:[0,-7]});
      mk.on('click', (function(lg){ return function(){ window.open(watchURL(lg), '_blank', 'noopener'); }; })(login));
      mk.addTo(map);
      offMarkers[login] = mk;
    });
  }

  function setCount(n){
    document.getElementById('count').classList.toggle('is-live', n>0);
    document.getElementById('countN').textContent = n;
    document.getElementById('countLbl').textContent = 'live now';
  }

  function parseLive(data){
    var arr = (data && (data.live || data.channels || data.streams)) || (Array.isArray(data)?data:[]);
    if(!Array.isArray(arr)) arr = [];
    return arr.map(function(e){
      var login = (e.login || e.user_login || e.broadcaster_login || e.name || e.user_name || '').toString().toLowerCase();
      return {
        login: login,
        platform: (e.platform || 'twitch'),
        name:  e.name || e.display_name || e.user_name || login,
        cat:   e.game || e.category || e.game_name || '',
        title: e.title || '',
        viewers: e.viewers != null ? e.viewers : (e.viewer_count != null ? e.viewer_count : 0),
        encoderConfirmed: !!e.encoderConfirmed
      };
    }).filter(function(e){ return e.login; });
  }

  // Merge alt channels into one "person": keep the higher-viewer channel as
  // the active one, but treat both as the same primary login.
  function collapseLive(liveArr){
    var by = {};
    liveArr.forEach(function(e){
      var person = ALT2MAIN[e.login] || e.login;
      var cur = by[person];
      if(!cur || (+e.viewers||0) > (+cur.viewers||0)){
        by[person] = { person:person, login:e.login, name:e.name, cat:e.cat, title:e.title, viewers:e.viewers, platform:e.platform, encoderConfirmed:e.encoderConfirmed };
      }
    });
    return Object.keys(by).map(function(k){ return by[k]; });
  }

  function render(liveArr){
    Object.keys(liveMarkers).forEach(function(k){ map.removeLayer(liveMarkers[k]); });
    liveMarkers = {};

    var list = document.getElementById('liveList');
    list.innerHTML = '';
    var people = collapseLive(liveArr);
    setCount(people.length);

    if(people.length === 0){
      renderOffline(document.getElementById('showOff').checked);
      list.innerHTML = '<div class="empty">No Mushboxes are live right now.<br>The map lights up the moment someone goes live.</div>';
      stamp();
      return;
    }

    var placed = [], unmapped = [], bounds = [];

    // resolve each live person's location (title overrides home)
    var items = [];
    people.forEach(function(e){
      var det = detectFromTitle(e.title), loc;
      if(det){ loc = {lat:det.lat,lng:det.lng,label:det.label,source:'title'}; }
      else if(HOMES[e.person]){ var h=HOMES[e.person]; loc = {lat:h[0],lng:h[1],label:h[2],source:'home'}; }
      else { unmapped.push(e); return; }
      e.label = loc.label; e.source = loc.source;
      // AMBER if the encoder is connected but no platform has confirmed live yet
      // (bonding/testing, or a brief lag before Twitch/Kick catches up).
      // Otherwise: RED/GREEN if live in an IRL category; BLUE if just live.
      e.warming = (e.platform === 'encoder');
      e.irl = e.warming ? false : isIRL(e.cat);
      items.push({ e:e, loc:loc });
    });

    // fixed pixel slot for home-based dots (stable); ring title collisions live
    var tgroups = {};
    items.forEach(function(it){
      if(it.loc.source === 'title'){
        var key = it.loc.lat.toFixed(3)+','+it.loc.lng.toFixed(3);
        (tgroups[key] = tgroups[key] || []).push(it);
      }
    });
    Object.keys(tgroups).forEach(function(key){
      var g = tgroups[key].sort(function(a,b){ return a.e.person < b.e.person ? -1 : 1; });
      g.forEach(function(it, i){ it.off = ringPx(i, g.length); });
    });
    items.forEach(function(it){
      if(!it.off) it.off = (it.loc.source === 'home') ? (HOME_OFFSET[it.e.person] || [0,0]) : [0,0];
    });

    items.forEach(function(it){
      var e = it.e, loc = it.loc, off = it.off;
      var mk = L.marker([loc.lat,loc.lng], { icon:liveIcon(loc.source, off, e.irl, e.platform, e.warming), zIndexOffset:(e.irl?1000:(e.warming?800:600)), riseOnHover:true });
      // Function content so both the popup and the hover card read AVATARS at
      // open time — the pic appears the instant the roster fetch lands.
      mk.bindPopup((function(ev){ return function(){ return popupHTML(ev); }; })(e),
        {closeButton:true, offset:[off[0], off[1]-6]});
      mk.bindTooltip((function(ev){ return function(){ return liveTip(ev); }; })(e),
        {direction:'top', className:'offtip', opacity:1, offset:[off[0], off[1]-9]});
      mk.addTo(map);
      liveMarkers[e.person] = mk;
      bounds.push([loc.lat,loc.lng]);
      placed.push({e:e, mk:mk});
    });

    renderOffline(document.getElementById('showOff').checked);

    placed.forEach(function(o){
      var e=o.e, mk=o.mk;
      var row = document.createElement('a');
      row.className = 'row' + (e.irl?' irl':'') + (e.warming?' warming':'');
      row.href = watchURL(e.login, e.platform); row.target='_blank'; row.rel='noopener';
      var pin = e.source==='title' ? '<span class="pin">📍</span> ' : '';
      row.innerHTML =
        '<span class="beacon-mini"></span>'
        + '<span class="info"><span class="nm">'+esc(e.name)+'</span>'
        + '<span class="sub">'+pin+esc(e.label) + (e.cat ? ' · '+esc(e.cat) : '') +'</span></span>'
        + '<span class="vw">'+fmtViewers(e.viewers)+'<small>WATCHING</small></span>';
      row.addEventListener('mouseenter', function(){ mk.openPopup(); });
      list.appendChild(row);
      mk.on('popupopen', function(){ row.classList.add('hot'); this.closeTooltip(); });
      mk.on('popupclose', function(){ row.classList.remove('hot'); });
    });

    if(unmapped.length){
      var u = document.createElement('div'); u.className='unmapped';
      u.innerHTML = '📍 Live, no location yet: ' + unmapped.map(function(e){return '<b>'+esc(e.name)+'</b>';}).join(', ')
                  + ' — add a home base or they can put a city in their title.';
      list.appendChild(u);
    }

    if(!EMBED && bounds.length) map.flyToBounds(bounds, { padding:[70,70], maxZoom:6, duration:.6 });
    stamp();
  }

  function stamp(){
    document.getElementById('updated').textContent =
      'updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }

  function load(){
    document.getElementById('updated').textContent = 'refreshing…';
    fetch(WORKER, { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data){ render(parseLive(data)); })
      .catch(function(err){
        console.error('[mushbox-map] fetch failed:', err);
        document.getElementById('liveList').innerHTML =
          '<div class="empty">Couldn\u2019t reach the live-status service.<br>It\u2019ll retry automatically.</div>';
        document.getElementById('countLbl').textContent = 'offline';
        document.getElementById('updated').textContent = 'retrying…';
      });
  }

  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('showOff').addEventListener('change', function(){ renderOffline(this.checked); });

  // One-shot fetch of roster avatars/names. Kept separate from the live poll:
  // avatars are ~static (cached daily at the Worker) so we let the browser
  // cache honor that Cache-Control rather than forcing no-store like live.
  function loadAvatars(){
    fetch(AVATARS_URL, { cache:'default' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if(d){ AVATARS = d.avatars || {}; NAMES = d.names || {}; } })
      .catch(function(){ /* offline cards just fall back to name-only */ });
  }

  renderOffline(true);
  load();
  loadAvatars();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
