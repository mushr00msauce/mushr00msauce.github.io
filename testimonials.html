<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word of Mouth — Mushbox</title>
<meta name="description" content="Real streamers on what the Mushbox does for their IRL broadcasts. Every build so far has come from word of mouth.">

<!-- Open Graph — for clean sharing in Discord / Twitter / socials -->
<meta property="og:title" content="Word of Mouth — Mushbox">
<meta property="og:description" content="What the family says. Real testimonials from streamers running a Mushbox.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --black:        #060810;
    --navy:         #0A1535;
    --navy-lift:    #0E1C44;
    --royal:        #1E6FFF;
    --sky:          #4DB8FF;
    --white:        #FFFFFF;
    --muted:        #8A9BC4;   /* navy-tinted gray, stays in-family */
    --muted-dim:    #5C6B92;
    --border:       rgba(77, 184, 255, 0.14);
    --border-hover: rgba(77, 184, 255, 0.55);
    --glow:         rgba(30, 111, 255, 0.35);

    --display: 'Orbitron', system-ui, sans-serif;
    --body:    'Space Grotesk', system-ui, sans-serif;

    --maxw: 1160px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Ambient signal glow behind the hero */
  body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translateX(-50%);
    background: radial-gradient(circle, var(--glow) 0%, transparent 62%);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Signature: bonded-signal bars ---------- */
  .bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 3px;
    height: 15px;
  }
  .bars span {
    width: 3px;
    border-radius: 1px;
    background: var(--sky);
    display: block;
  }
  .bars span:nth-child(1) { height: 33%; }
  .bars span:nth-child(2) { height: 58%; }
  .bars span:nth-child(3) { height: 80%; }
  .bars span:nth-child(4) { height: 100%; }

  .bars.animate span { animation: pulse 1.8s ease-in-out infinite; }
  .bars.animate span:nth-child(2) { animation-delay: 0.2s; }
  .bars.animate span:nth-child(3) { animation-delay: 0.4s; }
  .bars.animate span:nth-child(4) { animation-delay: 0.6s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  /* ---------- Hero ---------- */
  header.hero {
    padding: 96px 0 60px;
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--display);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--sky);
    margin-bottom: 28px;
  }

  h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(2.8rem, 9vw, 6rem);
    line-height: 0.98;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  h1 .of {
    color: var(--sky);
    -webkit-text-stroke: 0;
  }

  .lead {
    max-width: 620px;
    margin: 28px auto 0;
    font-size: clamp(1rem, 2.2vw, 1.18rem);
    color: var(--muted);
  }
  .lead strong { color: var(--white); font-weight: 600; }

  /* Stat strip */
  .stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 14px 26px;
    margin-top: 40px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.2;
  }
  .stat b {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--white);
  }
  .stat small {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-dim);
    margin-top: 4px;
  }
  .stat-sep { color: var(--border-hover); opacity: 0.5; }

  /* ---------- Grid ---------- */
  main { padding: 44px 0 40px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 26px;
  }

  .card {
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover,
  .card:focus-within {
    transform: translateY(-4px);
    border-color: var(--border-hover);
    box-shadow: 0 14px 40px -12px var(--glow);
  }

  /* Video / poster area */
  .media {
    position: relative;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, var(--navy-lift), var(--navy));
    overflow: hidden;
  }
  .media img.poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .media video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }

  /* Placeholder shown when no poster is provided */
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--muted-dim);
  }
  .placeholder .bars { height: 26px; }
  .placeholder .bars span { width: 5px; background: var(--muted-dim); }
  .placeholder span.ph-name {
    font-family: var(--display);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* Play button */
  .play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: rgba(6, 8, 16, 0.28);
    cursor: pointer;
    transition: background 0.25s ease;
  }
  .play:hover { background: rgba(6, 8, 16, 0.12); }
  .play:focus-visible { outline: 3px solid var(--sky); outline-offset: -3px; }

  .play-disc {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--royal);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 0 var(--glow);
    transition: transform 0.2s ease;
  }
  .play:hover .play-disc { transform: scale(1.08); }
  .play-disc::after {
    content: "";
    width: 0; height: 0;
    border-style: solid;
    border-width: 11px 0 11px 18px;
    border-color: transparent transparent transparent var(--white);
    margin-left: 4px;
  }
  /* pulse ring on the disc */
  .play-disc::before {
    content: "";
    position: absolute;
    width: 62px; height: 62px;
    border-radius: 50%;
    border: 2px solid var(--sky);
    animation: ring 2.4s ease-out infinite;
    opacity: 0;
  }
  @keyframes ring {
    0%   { transform: scale(1);   opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* Card body */
  .body {
    padding: 18px 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .who {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .who .bars { height: 13px; flex: none; }
  .who .name {
    font-weight: 600;
    font-size: 1.02rem;
    color: var(--white);
  }
  .who .handle {
    font-size: 0.86rem;
    color: var(--sky);
    text-decoration: none;
    margin-left: auto;
  }
  .who .handle:hover { text-decoration: underline; }

  blockquote {
    font-size: 0.96rem;
    color: var(--muted);
    border-left: 2px solid var(--royal);
    padding-left: 13px;
  }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    padding: 56px 0 72px;
    color: var(--muted-dim);
    font-size: 0.9rem;
  }
  footer a {
    color: var(--sky);
    text-decoration: none;
    font-weight: 500;
  }
  footer a:hover { text-decoration: underline; }
  .footer-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    padding: 13px 24px;
    border: 1px solid var(--border-hover);
    border-radius: 999px;
    color: var(--white);
    text-decoration: none;
    font-weight: 500;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .footer-cta:hover { background: rgba(30, 111, 255, 0.12); text-decoration: none; }

  /* Entrance animation */
  .reveal { opacity: 0; transform: translateY(16px); }
  .reveal.in { opacity: 1; transform: none; transition: opacity 0.6s ease, transform 0.6s ease; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; }
    .reveal.in { transition: none; }
  }

  @media (max-width: 560px) {
    header.hero { padding: 64px 0 40px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <header class="hero">
      <div class="eyebrow reveal">
        Mushbox
        <span class="bars animate" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        From the family
      </div>
      <h1 class="reveal">Word <span class="of">of</span> Mouth</h1>
      <p class="lead reveal">
        Every Mushbox out there came from one person telling another.
        No ads, no algorithm — just streamers who tried one and couldn't shut up about it.
        <strong>Here's what they say.</strong>
      </p>

      <!-- Edit these three in the CONFIG block below -->
      <div class="stats reveal" id="stats"></div>
    </header>

    <main>
      <div class="grid" id="grid"></div>
    </main>

    <footer class="reveal">
      <a class="footer-cta" href="https://themushbox.com">
        <span class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        Get your own Mushbox
      </a>
      <p>Ran a Mushbox and want to add your voice? <a href="https://themushbox.com/request.html">Send a clip.</a></p>
    </footer>
  </div>

<script>
/* =============================================================
   MUSHBOX — WORD OF MOUTH
   -------------------------------------------------------------
   To add or edit a testimonial, copy a block below and fill it in.
   Only "name" and "video" are required.

     name   : who's talking
     handle : their @ (optional) — links to their Twitch
     video  : path to the compressed .mp4 (see notes at bottom of chat)
     poster : path to a still image (optional but recommended)
     quote  : a short pull-quote (optional)

   Drop the .mp4 files into a folder next to this page, e.g.
   /testimonials-videos/ , and point "video" at them.
   ============================================================= */

  const CONFIG = {
    // The three numbers under the headline — edit freely.
    stats: [
      { n: "40+",  label: "Builds shipped" },
      { n: "44",   label: "In the family" },
      { n: "100%", label: "Word of mouth" }
    ]
  };

  const TESTIMONIALS = [
    {
      name: "Aprylanonymous",
      handle: "aprylanonymous",
      video: "testimonials-videos/apryl.mp4",
      poster: "",   // e.g. "testimonials-videos/apryl.jpg"
      quote: "I stream NYC every single day on this thing. It just doesn't drop."
    },
    {
      name: "Barktok",
      handle: "barktok",
      video: "testimonials-videos/barktok.mp4",
      poster: "",
      quote: "Mobile dog gym, moving the whole time — rock solid signal wherever we go."
    },
    {
      name: "AllDayNYC",
      handle: "alldaynyc",
      video: "testimonials-videos/alldaynyc.mp4",
      poster: "",
      quote: ""
    },
    {
      name: "Chefmaki",
      handle: "chefmaki",
      video: "testimonials-videos/chefmaki.mp4",
      poster: "",
      quote: ""
    }
    // ← copy a block above to add the rest of your ~10 clips
  ];

  /* ---------- render stats ---------- */
  const statsEl = document.getElementById("stats");
  CONFIG.stats.forEach((s, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "stat-sep bars";
      sep.setAttribute("aria-hidden", "true");
      sep.innerHTML = "<span></span><span></span><span></span><span></span>";
      statsEl.appendChild(sep);
    }
    const d = document.createElement("div");
    d.className = "stat";
    d.innerHTML = `<b>${s.n}</b><small>${s.label}</small>`;
    statsEl.appendChild(d);
  });

  /* ---------- render cards ---------- */
  const grid = document.getElementById("grid");

  function barsSVG() {
    return '<span class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>';
  }

  TESTIMONIALS.forEach(t => {
    const card = document.createElement("article");
    card.className = "card reveal";

    const handleHTML = t.handle
      ? `<a class="handle" href="https://twitch.tv/${t.handle}" target="_blank" rel="noopener">@${t.handle}</a>`
      : "";
    const quoteHTML = t.quote ? `<blockquote>${t.quote}</blockquote>` : "";

    const posterHTML = t.poster
      ? `<img class="poster" src="${t.poster}" alt="${t.name} testimonial" loading="lazy">`
      : `<div class="placeholder">${barsSVG().replace('class="bars"','class="bars animate"')}<span class="ph-name">${t.name}</span></div>`;

    card.innerHTML = `
      <div class="media">
        ${posterHTML}
        <button class="play" aria-label="Play ${t.name}'s testimonial">
          <span class="play-disc"></span>
        </button>
      </div>
      <div class="body">
        <div class="who">
          ${barsSVG()}
          <span class="name">${t.name}</span>
          ${handleHTML}
        </div>
        ${quoteHTML}
      </div>`;

    // Swap poster → real video only when the visitor presses play.
    const media = card.querySelector(".media");
    const playBtn = card.querySelector(".play");
    playBtn.addEventListener("click", () => {
      const v = document.createElement("video");
      v.src = t.video;
      v.controls = true;
      v.autoplay = true;
      v.playsInline = true;
      v.preload = "none";
      // Graceful failure if the file isn't there yet.
      v.addEventListener("error", () => {
        media.innerHTML = `<div class="placeholder">${barsSVG()}<span class="ph-name">Video coming soon</span></div>`;
      });
      media.innerHTML = "";
      media.appendChild(v);
      v.play().catch(() => {});
    });

    grid.appendChild(card);
  });

  /* ---------- entrance reveal ---------- */
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach((el, i) => {
    el.style.transitionDelay = Math.min(i * 0.05, 0.4) + "s";
    io.observe(el);
  });
</script>
</body>
</html>
